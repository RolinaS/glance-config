# Ressources Proxmox lues via l'API (token en lecture seule PVEAuditor)
# Variable PROXMOX_TOKEN = utilisateur@pve!nom_token=secret
- type: custom-api
  title: Proxmox
  title-url: https://pve.${DOMAIN}
  cache: 1m
  url: ${PVE_URL}/api2/json/cluster/resources
  allow-insecure: true
  headers:
    Accept: application/json
    Authorization: PVEAPIToken=${PROXMOX_TOKEN}
  template: |
    <style>
      .px-bar { width:100%; height:8px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; margin:6px 0 14px; }
      .px-fill { height:100%; border-radius:4px; min-width:4px;
                 background:linear-gradient(90deg, hsl(217 70 55) 0%, var(--color-primary) 100%); }
      .px-fill.warn { background:linear-gradient(90deg, hsl(30 80 55) 0%, hsl(45 90 65) 100%); }
      .px-fill.crit { background:var(--color-negative); }
      .px-guest { display:flex; justify-content:space-between; align-items:center; padding:6px 0;
                  border-top:1px solid rgba(255,255,255,0.05); }
      .px-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:8px; }
      .px-counters { display:flex; justify-content:space-around; text-align:center; margin-top:14px;
                     padding-top:12px; border-top:1px solid rgba(255,255,255,0.05); }
    </style>

    {{ if not (.JSON.Exists "data") }}
      <p class="color-negative">API Proxmox injoignable ou token invalide</p>
    {{ else }}

    {{ $cpu_total := 0.0 }}{{ $cpu_used := 0.0 }}{{ $mem_total := 0.0 }}{{ $mem_used := 0.0 }}{{ $uptime := 0 }}
    {{ range .JSON.Array "data.#(type==\"node\")#" }}
      {{ $cpu_total = add $cpu_total (.Float "maxcpu") }}
      {{ $cpu_used = add $cpu_used (mul (.Float "maxcpu") (.Float "cpu")) }}
      {{ $mem_total = add $mem_total (.Float "maxmem") }}
      {{ $mem_used = add $mem_used (.Float "mem") }}
      {{ $uptime = .Int "uptime" }}
    {{ end }}
    {{ $disk_total := 0.0 }}{{ $disk_used := 0.0 }}
    {{ range .JSON.Array "data.#(type==\"storage\")#" }}
      {{ $disk_total = add $disk_total (.Float "maxdisk") }}
      {{ $disk_used = add $disk_used (.Float "disk") }}
    {{ end }}
    {{ $cpu := 0.0 }}{{ if gt $cpu_total 0.0 }}{{ $cpu = mul (div $cpu_used $cpu_total) 100 }}{{ end }}
    {{ $mem := 0.0 }}{{ if gt $mem_total 0.0 }}{{ $mem = mul (div $mem_used $mem_total) 100 }}{{ end }}
    {{ $disk := 0.0 }}{{ if gt $disk_total 0.0 }}{{ $disk = mul (div $disk_used $disk_total) 100 }}{{ end }}

    <div class="flex justify-between"><span class="size-h5 uppercase"><span class="color-highlight">CPU</span> · {{ printf "%.0f" $cpu_total }} cœurs</span><span class="color-highlight size-h4">{{ printf "%.1f" $cpu }}%</span></div>
    <div class="px-bar"><div class="px-fill {{ if ge $cpu 90.0 }}crit{{ else if ge $cpu 75.0 }}warn{{ end }}" style="width:{{ $cpu }}%"></div></div>

    <div class="flex justify-between"><span class="size-h5 uppercase"><span class="color-highlight">RAM</span> · {{ printf "%.1f" (div $mem_used 1073741824) }} / {{ printf "%.0f" (div $mem_total 1073741824) }} Go</span><span class="color-highlight size-h4">{{ printf "%.1f" $mem }}%</span></div>
    <div class="px-bar"><div class="px-fill {{ if ge $mem 90.0 }}crit{{ else if ge $mem 75.0 }}warn{{ end }}" style="width:{{ $mem }}%"></div></div>

    <div class="flex justify-between"><span class="size-h5 uppercase"><span class="color-highlight">Stockage</span> · {{ printf "%.0f" (div $disk_used 1073741824) }} / {{ printf "%.0f" (div $disk_total 1073741824) }} Go</span><span class="color-highlight size-h4">{{ printf "%.1f" $disk }}%</span></div>
    <div class="px-bar"><div class="px-fill {{ if ge $disk 80.0 }}crit{{ else if ge $disk 65.0 }}warn{{ end }}" style="width:{{ $disk }}%"></div></div>

    <div class="size-h5 uppercase color-highlight" style="margin-bottom:4px">Nœuds</div>
    {{ range .JSON.Array "data.#(type==\"node\")#" }}
      <div class="px-guest">
        <span>
          <span class="px-dot" style="background:{{ if eq (.String "status") "online" }}var(--color-positive){{ else }}var(--color-negative){{ end }}"></span>
          <span class="color-highlight">{{ .String "node" }}</span>
        </span>
        <span class="size-h6">
          {{ if eq (.String "status") "online" }}
            {{ printf "%.0f" (mul (.Float "cpu") 100) }}% CPU · {{ printf "%.0f" (mul (div (.Float "mem") (.Float "maxmem")) 100) }}% RAM · {{ div (.Int "uptime") 86400 }} j
          {{ else }}<span class="color-negative">hors ligne</span>{{ end }}
        </span>
      </div>
    {{ end }}
    <div style="height:12px"></div>

    <div class="size-h5 uppercase color-highlight" style="margin-bottom:4px">Invités</div>
    {{ range .JSON.Array "data.#(template==0)#" }}
      {{ if or (eq (.String "type") "lxc") (eq (.String "type") "qemu") }}
      <div class="px-guest">
        <span>
          <span class="px-dot" style="background:{{ if eq (.String "status") "running" }}var(--color-positive){{ else }}var(--color-negative){{ end }}"></span>
          <span class="color-highlight">{{ .Int "vmid" }} {{ .String "name" }}</span> <span class="size-h6">· {{ .String "node" }}</span>
        </span>
        <span class="size-h6">
          {{ if eq (.String "status") "running" }}
            {{ printf "%.0f" (mul (.Float "cpu") 100) }}% CPU · {{ printf "%.0f" (mul (div (.Float "mem") (.Float "maxmem")) 100) }}% RAM
          {{ else }}<span class="color-negative">arrêté</span>{{ end }}
        </span>
      </div>
      {{ end }}
    {{ end }}

    <div class="px-counters">
      <div><div class="color-highlight size-h3">{{ len (.JSON.Array "data.#(type==\"lxc\")#|#(status==\"running\")#") }}/{{ len (.JSON.Array "data.#(type==\"lxc\")#|#(template==0)#") }}</div><div class="size-h6 uppercase">LXC</div></div>
      <div><div class="color-highlight size-h3">{{ len (.JSON.Array "data.#(type==\"qemu\")#|#(status==\"running\")#") }}/{{ len (.JSON.Array "data.#(type==\"qemu\")#|#(template==0)#") }}</div><div class="size-h6 uppercase">VM</div></div>
      <div><div class="color-highlight size-h3">{{ len (.JSON.Array "data.#(type==\"node\")#|#(status==\"online\")#") }}/{{ len (.JSON.Array "data.#(type==\"node\")#") }}</div><div class="size-h6 uppercase">Nœuds</div></div>
    </div>
    {{ end }}
